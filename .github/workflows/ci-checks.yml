name: CI - Static Analysis & Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  orders-api:
    name: Go (orders-api) - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: orders-api/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: orders-api

      - name: Run unit tests
        run: go test -v -race ./...

  dockerfiles:
    name: Dockerfiles - hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: warning

  shell-scripts:
    name: Shell Scripts - shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck on scripts/
        run: |
          if [ -d scripts ] && [ -n "$(find scripts -name '*.sh')" ]; then
            find scripts -name '*.sh' -exec shellcheck {} +
          else
            echo "No shell scripts yet"
          fi
