apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhaba-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: dhaba.local
      http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 80
