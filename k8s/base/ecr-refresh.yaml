apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresher-binding
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresher
roleRef:
  kind: Role
  name: ecr-secret-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresh
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-token-refresher
          restartPolicy: OnFailure
          containers:
            - name: refresh-ecr
              image: amazon/aws-cli:2.17.0
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                  chmod +x kubectl
                  TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
                  ./kubectl delete secret ecr-pull-secret --ignore-not-found
                  ./kubectl create secret docker-registry ecr-pull-secret \
                    --docker-server="${AWS_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com" \
                    --docker-username=AWS \
                    --docker-password="$TOKEN"
              envFrom:
                - secretRef:
                    name: aws-ecr-refresher
