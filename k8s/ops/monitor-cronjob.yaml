apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-monitor
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-monitor-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "events", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-monitor-reader-binding
subjects:
  - kind: ServiceAccount
    name: ops-monitor
    namespace: ops
roleRef:
  kind: ClusterRole
  name: ops-monitor-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-state-manager
  namespace: ops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-state-manager-binding
subjects:
  - kind: ServiceAccount
    name: ops-monitor
    namespace: ops
roleRef:
  kind: Role
  name: ops-state-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dhaba-monitor
  namespace: ops
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ops-monitor
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ecr-pull-secret
          containers:
            - name: monitor
              image: ops-monitor:latest
              envFrom:
                - secretRef:
                    name: monitor-secrets
